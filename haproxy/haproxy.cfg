# Global settings
#---------------------------------------------------------------------
global
    maxconn     20000
    log         /dev/log local0 info
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    user        haproxy
    group       haproxy
    daemon

    # turn on stats unix socket
    stats socket /var/lib/haproxy/stats

#---------------------------------------------------------------------
# common defaults that all the 'listen' and 'backend' sections will
# use if not designated in their block
#---------------------------------------------------------------------
defaults
    log                     global
    mode                    http
    option                  httplog
    option                  dontlognull
    option http-server-close
    option redispatch
    option forwardfor       except 127.0.0.0/8
    retries                 3
    maxconn                 20000
    timeout http-request    10000ms
    timeout http-keep-alive 10000ms
    timeout check           10000ms
    timeout connect         40000ms
    timeout client          300000ms
    timeout server          300000ms
    timeout queue           50000ms

# Enable HAProxy stats
listen stats
    bind :9000
    stats uri /stats
    stats refresh 10000ms

# Kube API Server
frontend k8s_api_frontend
    bind :6443
    default_backend k8s_api_backend
    mode tcp

backend k8s_api_backend
    mode tcp
    balance source
    server      bootstrap 10.9.8.10:6443 check
    server      master01 10.9.8.11:6443 check
    server      master02 10.9.8.12:6443 check
    server      master03 10.9.8.13:6443 check

# OCP Machine Config Server
frontend ocp_machine_config_server_frontend
    mode tcp
    bind :22623
    default_backend ocp_machine_config_server_backend

backend ocp_machine_config_server_backend
    mode tcp
    balance source
    server      bootstrap 10.9.8.10:22623 check
    server      master01 10.9.8.11:22623 check
    server      master02 10.9.8.12:22623 check
    server      master03 10.9.8.13:22623 check

# OCP Ingress - layer 4 tcp mode for each. Ingress Controller will handle layer 7.
frontend ocp_http_ingress_frontend
    bind :80
    default_backend ocp_http_ingress_backend
    mode tcp

backend ocp_http_ingress_backend
    balance source
    mode tcp
    server      worker01 10.9.8.11:80 check
    server      worker02 10.9.8.12:80 check
    server      worker03 10.9.8.13:80 check
    server      worker04 10.9.8.21:80 check
    server      worker05 10.9.8.22:80 check

frontend ocp_https_ingress_frontend
    bind *:443
    default_backend ocp_https_ingress_backend
    mode tcp

backend ocp_https_ingress_backend
    mode tcp
    balance source
    server      worker01 10.9.8.11:443 check
    server      worker02 10.9.8.12:443 check
    server      worker03 10.9.8.13:443 check
    server      worker04 10.9.8.21:443 check
    server      worker05 10.9.8.22:443 check

# ========================
# External API Access
# ========================
frontend k8s_api_external
    bind 192.168.157.128:6443
    mode tcp
    option tcplog
    default_backend k8s_api_backend

# ========================
# External HTTPS Ingress
# ========================
frontend ocp_https_ingress_external
    bind 192.168.157.128:443
    mode tcp
    option tcplog
    default_backend ocp_https_ingress_backend

# ========================
# External HTTP Ingress
# ========================
frontend ocp_http_ingress_external
    bind 192.168.157.128:80
    mode tcp
    option tcplog
    default_backend ocp_http_ingress_backend

